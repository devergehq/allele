[package]
name = "allele"
version = "0.7.2"
edition = "2021"
description = "Claude Code session manager — APFS clone management for parallel variant workflows"

[[bin]]
name = "Allele"
path = "src/main.rs"

[dependencies]
# GPUI — pinned to specific Zed commit (same rev Termy uses, known working)
gpui = { git = "https://github.com/zed-industries/zed", rev = "2c59293b69889610eba8f54920cca64c387308ba", package = "gpui" }

# Terminal emulation — Deverge fork with CSI 2J scrollback fix
alacritty_terminal = { git = "https://github.com/devergehq/alacritty.git", branch = "allele/clear-scrollback-on-csi2j" }

# Event channels (PTY ↔ UI)
flume = "0.11"

# Error handling
anyhow = "1"

# Typed errors
thiserror = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System FFI (clonefile)
libc = "0.2"

# Path utilities
dirs = "6"
# Fast non-cryptographic hashing for the per-render terminal path index (DEV-1262).
# Already in the tree via gpui; pinned to the locked 2.x.
rustc-hash = "2.1"
which = "7"

# Grapheme-aware text segmentation for the Settings text input
unicode-segmentation = "1"

# State management
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async methods in the `SyncStore` trait (dyn-compatible) — session sync
async-trait = "0.1"

# File watching (for hook events)
notify = "7"

# Markdown parsing for Rich Sidecar TextBlock rendering
pulldown-cmark = { version = "0.13.0", default-features = false }

# Line-level diffs for unified Edit rendering in Rich Sidecar
similar = "2"

# S3-compatible object store for session sync (durch/rust-s3). Default features
# use tokio + native-tls, which on macOS is Security.framework (no OpenSSL).
rust-s3 = "0.37.2"

# Peer-to-peer QUIC transport for multi-machine (DEV-1159). Endpoints are
# dialed by public key; iroh handles hole-punching and relay fallback. Pinned
# exactly: n0 retires relays for old versions, so upgrades are deliberate.
# Only `src/remote/iroh_transport.rs` may name this crate (tests/architecture.rs).
# Default features minus `metrics` and `portmapper` (~1.1 MB, DEV-1158 spike).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
# The `Stream` trait, to consume iroh's `paths_stream()` (DEV-1243). Already in
# the tree through tokio and iroh; named so it is ours to rely on.
futures-core = "0.3"

# Pairing (DEV-1160): the pairing secret's randomness, the code's base32 text,
# the confirmation number's hash, and the QR shown beside the code.
getrandom = "0.3"
data-encoding = "2"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }

# Client-side payload encryption for session sync (X25519 data key + scrypt
# passphrase wrapping).
age = "0.12.1"

# Tree-sitter syntax highlighting for the source Reader (DEV-73). Core + the
# highlight-query engine, plus a curated Tier-1 set of grammars. Unsupported
# languages fall back to the built-in lexer in reader/highlight.rs. Long-tail /
# dynamic grammar loading is tracked in DEV-63.
tree-sitter = "0.26.10"
tree-sitter-highlight = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-php = "0.24.2"

# APFS COW cloning
# clonetree or direct libc FFI — evaluate during Phase 1

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"  # Pin to avoid core-graphics version conflict with GPUI
cocoa = "0.26"
objc = "0.2"
# Keychain storage for the session-sync data key (already in the tree via rust-s3).
security-framework = "3"

[lints.rust]
# The `objc` 0.2 crate expands `#[cfg(feature = "cargo-clippy")]` inside its
# `msg_send!` / `class!` macros. That feature name is a legacy nightly signal
# that no longer exists, and cargo's check-cfg flags it. The crate is
# unmaintained (no newer release fixes this), so teach check-cfg about it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2c59293b69889610eba8f54920cca64c387308ba", package = "gpui", features = ["test-support"] }
tempfile = "3"
# Paused-clock tests for the reconnect supervisor (`remote::link`, DEV-1159).
tokio = { version = "1", features = ["full", "test-util"] }
# A local relay server so the iroh transport tests run offline (DEV-1159).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "test-utils"] }

# Architecture fitness tests (tests/architecture.rs) — walk the source tree and
# parse it to enforce the invariants in ARCHITECTURE.md §7.
walkdir = "2"
syn = { version = "2", features = ["full", "visit", "parsing"] }
